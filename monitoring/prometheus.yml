global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Config Server metrics
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: admin
      password: admin123
    static_configs:
      - targets: ['comprae-config-server:8080']
    scrape_interval: 5s
    
  # Produto Service metrics
  - job_name: 'produto-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['comprae-produto-service:8080']
    scrape_interval: 5s
    
  # Self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['config-server-prometheus:9090']

