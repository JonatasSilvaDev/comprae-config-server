# Configuração principal da aplicação
spring.application.name=config-server
server.port=8080

# Configuração do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/configdb
spring.datasource.username=${USERNAME:admin}
spring.datasource.password=${PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configuração do Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Configuração do Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=1
spring.kafka.producer.buffer-memory=33554432
 
# Expor endpoint Prometheus para métricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=UNRESTRICTED

# Configuração do Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Configuração do Actuator - Observabilidade Avançada
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,caches,configprops,env,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.access=UNRESTRICTED
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=10s
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=development

# Configuração do Quartz - Simplificada para usar em memória
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=ConfigServerScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# Configuração de logging estruturado
logging.level.com.configsystem=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.cache=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n

# Configuração de Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Configuração de autenticação - DESABILITADA PARA DEMONSTRAÇÃO
# Para projetos de produção, habilite as linhas abaixo:
# USERNAME e PASSWORD podem ser definidas como variáveis de ambiente
# spring.security.user.name=${USERNAME:admin}
# spring.security.user.password=${PASSWORD:admin123}

# Configuração personalizada
kafka.topic.config-changes=config-changes
cache.ttl.configurations=3600
sync.scheduler.enabled=true
sync.scheduler.interval=30000

# Configuração do OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Configuração do Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.database.register-health-indicator=true
resilience4j.circuitbreaker.instances.database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.database.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.database.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.database.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.database.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.database.sliding-window-size=10
resilience4j.circuitbreaker.instances.database.sliding-window-type=count_based

resilience4j.circuitbreaker.instances.redis.register-health-indicator=true
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=20s

# Configuração do Resilience4j - Retry
resilience4j.retry.instances.database.max-attempts=3
resilience4j.retry.instances.database.wait-duration=2s
resilience4j.retry.instances.database.exponential-backoff-multiplier=2

resilience4j.retry.instances.redis.max-attempts=3
resilience4j.retry.instances.redis.wait-duration=1s

# Cache Multi-Layer (L1: Caffeine, L2: Redis)
spring.cache.cache-names=configurations,services,health-status
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m
spring.cache.redis.enable-statistics=true

# Health Check personalizado
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
